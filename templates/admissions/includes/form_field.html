<!-- templates/admissions/includes/form_field.html -->

<div class="flex flex-col gap-1">
  <label for="{{ field.id_for_label }}"
         class="text-xs text-white/40 uppercase tracking-wider">
    {{ field.label }}
    {% if field.field.required %}
    <span class="text-red-400">*</span>
    {% endif %}
  </label>

  <!-- Render the field with consistent styling -->
  <div class="
    {% if field.errors %}border-red-500/50{% else %}border-white/10{% endif %}
    border rounded-lg overflow-hidden">
    {{ field }}
  </div>

  <!-- Field errors -->
  {% if field.errors %}
  {% for error in field.errors %}
  <p class="text-red-400 text-xs">{{ error }}</p>
  {% endfor %}
  {% endif %}
</div>
