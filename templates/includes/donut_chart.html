<!-- templates/includes/donut_chart.html -->
<!-- Pure SVG donut chart — no JavaScript library needed -->

{% with fail_rate=100|add:"-"|add:pass_rate %}
<div class="relative w-48 h-48">
  <svg viewBox="0 0 100 100" class="w-full h-full -rotate-90">

    <!-- Background track -->
    <circle
      cx="50" cy="50" r="38"
      fill="none"
      stroke="rgba(20,27,45,0.08)"
      stroke-width="12"
    />

    <!-- Pass segment — teal -->
    <circle
      cx="50" cy="50" r="38"
      fill="none"
      stroke="#2fb857"
      stroke-width="12"
      stroke-dasharray="{{ pass_rate|floatformat:1 }} 100"
      stroke-dashoffset="0"
      stroke-linecap="round"
      pathLength="100"
    />

    <!-- Fail segment — red, offset by the pass segment -->
    <circle
      cx="50" cy="50" r="38"
      fill="none"
      stroke="#f87171"
      stroke-width="12"
      stroke-dasharray="{{ fail_rate }} 100"
      stroke-dashoffset="-{{ pass_rate|floatformat:1 }}"
      stroke-linecap="round"
      pathLength="100"
    />

  </svg>

  <!-- Centre label -->
  <div class="absolute inset-0 flex flex-col items-center justify-center">
    <span class="text-3xl font-bold">{{ pass_rate }}%</span>
    <span class="text-itca-navy/50 text-xs">{% firstof label "Passing" %}</span>
  </div>
</div>
{% endwith %}
